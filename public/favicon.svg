  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="256.0" rx="115" fill="url(#sheen)"/>
  <!-- M monogram: peaks drawn as one continuous rising metrics line -->
  <g transform="translate(256.0,276.48)" fill="none" stroke="#FFFFFF"
