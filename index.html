<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Metricorex — The All-in-One Business Suite: Work, Team, Money &amp; Payments</title>
    <meta
      name="description"
      content="Metricorex is the all-in-one business suite where your whole business runs: tasks &amp; boards, video meetings &amp; team chat with AI notes, payroll, wallets &amp; transfers, payment links, smart invoices, a storefront and recurring billing — one login, one workspace, one wallet."
    />
    <meta
      name="keywords"
      content="Metricorex, all-in-one business suite, business OS, project management, task tracker, kanban board, team collaboration, video meetings, team chat, AI meeting notes, payroll, bulk payments, international transfers, business wallet, virtual account, payment links, smart invoices, storefront, online store, recurring billing, subscription billing, MetricAi, Flutterwave"
    />
    <meta name="author" content="Metricorex" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.metricorex.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metricorex" />
    <meta property="og:url" content="https://app.metricorex.com/" />
    <meta property="og:title" content="Metricorex — The All-in-One Business Suite: Work, Team, Money &amp; Payments" />
    <meta
      property="og:description"
      content="One suite for your whole business — tasks, boards, meetings, chat, payroll, wallets, transfers, payment links, smart invoices, storefront and recurring billing. One login, one workspace, one wallet."
    />
    <meta property="og:image" content="https://app.metricorex.com/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metricorex — The All-in-One Business Suite: Work, Team, Money &amp; Payments" />
    <meta
      name="twitter:description"
      content="One suite for your whole business — tasks, boards, meetings, chat, payroll, wallets, transfers, payment links, smart invoices, storefront and recurring billing. One login, one workspace, one wallet."
    />
    <meta name="twitter:image" content="https://app.metricorex.com/og-image.png?v=3" />

    <!-- Structured data: what Metricorex is (all-in-one business suite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Metricorex",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "All-in-one business suite: task & project management, kanban board, video calls and meetings, team chat with AI notes, payroll, business wallets with virtual accounts, bulk and international transfers, payment links, smart invoices, storefront with hosted checkout and recurring billing (customer subscriptions).",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "0",
          "priceCurrency": "USD",
          "offerCount": "5"
        }
      }
    </script>

    <!-- Brand -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon-192-maskable.png" color="#4353FF" />
    <meta name="theme-color" content="#4353FF" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
