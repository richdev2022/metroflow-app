    <link rel="canonical" href="https://app.metricorex.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metricorex" />
    <meta property="og:url" content="https://app.metricorex.com/" />
    <meta property="og:title" content="Metricorex — Business OS for Teams: Tasks, Calls, Meetings, Chat &amp; Fintech" />
    <meta
      property="og:description"
      content="Run your whole business and your money in one place — tasks, meetings, team chat, AI notes, payroll, wallets, transfers, payment links, invoices, daily bill payments and goal-based savings. Built for Personal and Business."

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Run your whole business and your money in one place — tasks, meetings, team chat, AI notes, payroll, wallets, transfers, payment links, invoices, daily bill payments and goal-based savings. Built for Personal and Business."
    />
    <meta name="twitter:image" content="https://app.metricorex.com/og-image.png?v=3" />

    <!-- Structured data: what Metricorex is (Personal + Business coverage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Metricorex",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "All-in-one business OS for Personal and Business use: task & project management, video calls and meetings, team chat with AI notes, payroll, personal and business wallets, bulk transfers, international payouts, payment links, smart invoices, daily bill payments (airtime, data, TV, electricity) and goal-based savings vaults with auto-save.",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "0",
          "priceCurrency": "USD",
          "offerCount": "5"
        }
      }
    </script>

    <!-- Brand -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon-192-maskable.png" color="#4353FF" />
    <meta name="theme-color" content="#4353FF" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
