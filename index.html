<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Metricorex — Business OS: Tasks, Meetings, Payroll &amp; Business Banking</title>
    <meta
      name="description"
      content="Metricorex is the all-in-one business OS for modern teams: project &amp; task tracking, video meetings and calls, team chat, payroll, transfers and business virtual accounts — unified in one platform."
    />
    <meta
      name="keywords"
      content="Metricorex, business OS, project management, task tracker, video meetings, team chat, payroll, bulk payments, international transfers, business banking, virtual account, Flutterwave"
    />
    <meta name="author" content="Metricorex" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://metricorex.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Metricorex" />
    <meta property="og:url" content="https://metricorex.com/" />
    <meta property="og:title" content="Metricorex — Business OS: Tasks, Meetings, Payroll &amp; Business Banking" />
    <meta
      property="og:description"
      content="Projects, meetings, payroll and business banking in one unified platform for modern teams."
    />
    <meta property="og:image" content="https://metricorex.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metricorex — Business OS" />
    <meta
      name="twitter:description"
      content="Projects, meetings, payroll and business banking in one unified platform for modern teams."
    />
    <meta name="twitter:image" content="https://metricorex.com/og-image.png" />

    <!-- Brand -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="theme-color" content="#2563EB" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
